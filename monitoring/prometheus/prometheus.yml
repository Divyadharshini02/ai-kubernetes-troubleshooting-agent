# Scrapes the backend over the Compose network. See docs/M9_MONITORING.md.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
