# The application in containers, at http://localhost:8088. See docs/M8_DOCKER_JENKINS_TRIVY.md.
# First run: backend\.venv\Scripts\python.exe scripts\new_readonly_kubeconfig.py --container
name: troubleshooting-agent

services:
  backend:
    build: ./backend
    image: troubleshooting-agent-backend:local
    environment:
      KUBECONFIG: /run/agent-kube/kubeconfig
    volumes:
      # Only this folder, which holds only the restricted kubeconfig. Never ~/.kube itself.
      - ${USERPROFILE:?USERPROFILE must be set}/.kube/troubleshooting-agent-container:/run/agent-kube:ro
      - agent-data:/app/data
    networks:
      - app
      # The API server can only be reached by name from this network.
      - kind
    mem_limit: 384m
    cpus: 1.0
    # Not published. It is reached only through the frontend.

  frontend:
    build: ./frontend
    image: troubleshooting-agent-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - app
    mem_limit: 64m
    cpus: 0.25

  # Monitoring starts only with --profile monitoring. See docs/M9_MONITORING.md.
  # Both join only the app network, so neither has any route to the cluster.
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - app
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    profiles: [monitoring]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app
    mem_limit: 384m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  agent-data:
  prometheus-data:
  grafana-data:

networks:
  app:
  kind:
    external: true

secrets:
  grafana_admin_password:
    file: ${USERPROFILE:?USERPROFILE must be set}/.troubleshooting-monitoring/grafana-admin-password
