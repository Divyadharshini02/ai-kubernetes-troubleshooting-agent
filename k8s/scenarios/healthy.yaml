# The healthy baseline for docs/M6_FAILURE_SCENARIOS.md, and the fix for every scenario.
# Apply one file in this folder at a time. Applying the whole folder would apply every fault.
apiVersion: v1
kind: Namespace
metadata:
  name: failure-demo
  labels:
    app.kubernetes.io/managed-by: failure-scenarios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: failure-demo
  labels:
    app: demo-web
    app.kubernetes.io/managed-by: failure-scenarios
spec:
  replicas: 1
  # The old pod stops before the new one starts, so a fault really takes the app down.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
        app.kubernetes.io/managed-by: failure-scenarios
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            # nginx took 6 to 8 seconds to answer here. Probing sooner records failures that
            # look like an unstable pod, even on an idle machine.
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: failure-demo
  labels:
    app: demo-web
    app.kubernetes.io/managed-by: failure-scenarios
spec:
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: http
